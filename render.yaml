services:
  # ============================================================================
  # LEED BACKEND WEB SERVICE (RENDER FREE TIER)
  # ============================================================================
  - type: web
    name: leed-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build --workspace=@prospect/backend
    startCommand: cd apps/backend && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: "postgresql://postgres.afcvvbfpoqtvjggeeupa:Q1SwWJRE3uzt1Dul@aws-1-eu-central-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_DRY_RUN
        value: "false"
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_DRY_RUN
        value: "false"
      - key: PUSH_ENABLED
        value: "true"
      - key: PUSH_DRY_RUN
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_DRY_RUN
        value: "true"
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: RADAR_WORKER_INTERVAL_MS
        value: "60000"
      - key: FRESHNESS_WORKER_INTERVAL_MS
        value: "300000"
      # Operator API keys (Prompted in Render Dashboard upon deployment)
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Leed Alerts <onboarding@resend.dev>"
