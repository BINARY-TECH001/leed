services:
  # ============================================================================
  # LEED BACKEND WEB SERVICE (RENDER FREE TIER)
  # ============================================================================
  - type: web
    name: leed-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=@prospect/backend
    startCommand: cd apps/backend && npx prisma db push && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: leed-db
          property: connectionString
      - key: JWT_SECRET
        generateCrypto: true
      - key: JWT_REFRESH_SECRET
        generateCrypto: true
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_DRY_RUN
        value: "false"
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_DRY_RUN
        value: "false"
      - key: PUSH_ENABLED
        value: "true"
      - key: PUSH_DRY_RUN
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_DRY_RUN
        value: "true"
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: RADAR_WORKER_INTERVAL_MS
        value: "60000"
      - key: FRESHNESS_WORKER_INTERVAL_MS
        value: "300000"
      # Operator API keys (Fill in Render Dashboard or sync with secrets)
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Leed Alerts <onboarding@resend.dev>"

databases:
  # ============================================================================
  # LEED POSTGRESQL DATABASE (RENDER FREE TIER)
  # ============================================================================
  - name: leed-db
    plan: free
    region: oregon
    databaseName: leed
    user: leed_user
